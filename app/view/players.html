<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search the 2023 Women's World Cup squad players of Brazil, the United States, Germany, Norway, Japan and Spain.">
  <title>Players - Women's World Cup Database Museum</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
  <link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body data-page="players">
  <div id="site-nav"></div>

  <header class="hero text-center text-white">
    <h1 class="display-5 fw-bold">Players</h1>
    <p class="lead mb-0">Search the 2023 squad players of Brazil, the United States, Germany, Norway, Japan and Spain.</p>
  </header>

  <main class="page-wrap content-area py-4 py-md-5">

    <div id="error" class="alert alert-danger d-none" role="alert"></div>

    <section aria-labelledby="search-title">
      <h2 class="h3 mb-3" id="search-title">Find a player</h2>
      <div class="row g-3 mb-4">
        <div class="col-12 col-md-6 col-lg-3">
          <label for="q" class="form-label">Name or club</label>
          <input id="q" type="search" class="form-control" maxlength="60" autocomplete="off" placeholder="For example: Marta, Barcelona">
        </div>
        <div class="col-6 col-md-3 col-lg-3">
          <label for="team-filter" class="form-label">Team</label>
          <select id="team-filter" class="form-select">
            <option value="">All teams</option>
          </select>
        </div>
        <div class="col-6 col-md-3 col-lg-3">
          <label for="position-filter" class="form-label">Position</label>
          <select id="position-filter" class="form-select">
            <option value="">All positions</option>
            <option>Goalkeeper</option>
            <option>Defender</option>
            <option>Midfielder</option>
            <option>Forward</option>
          </select>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <label for="year-filter" class="form-label">Tournament</label>
          <select id="year-filter" class="form-select">
            <option value="">All tournaments</option>
          </select>
        </div>
      </div>

      <p class="text-muted" id="result-count" aria-live="polite">Loading players...</p>

      <div class="table-responsive">
        <table class="table table-striped table-players">
          <thead>
            <tr>
              <th scope="col">No.</th>
              <th scope="col">Player</th>
              <th scope="col">Team</th>
              <th scope="col">Year</th>
              <th scope="col">Position</th>
              <th scope="col">Date of birth</th>
              <th scope="col">Awards and trophies</th>
              <th scope="col">Previous teams</th>
              <th scope="col">Current club</th>
              <th scope="col">Caps</th>
              <th scope="col">Goals</th>
            </tr>
          </thead>
          <tbody id="players-body"></tbody>
        </table>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="common.js"></script>
  <script src="players.js"></script>
</body>
</html>
