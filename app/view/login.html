<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Log-in page of the Women's World Cup Database Museum.">
  <title>Log-in - Women's World Cup Database Museum</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="styles.css" rel="stylesheet">
</head>
<body data-page="login">
  <div id="site-nav"></div>

  <header class="hero text-center text-white">
    <h1 class="display-5 fw-bold">Log-in</h1>
    <p class="lead mb-0">Save your favourite teams, players and stadiums, and keep your trivia scores.</p>
  </header>

  <main class="page-wrap content-area py-4 py-md-5">
    <div class="login-box">
      <div id="account-message" class="alert d-none" role="status"></div>

      <!-- Log in -->
      <form id="login-form" novalidate>
        <h2 class="h4 mb-3">Log in</h2>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
        <p class="mt-3 mb-0 text-center">No account yet?
          <button type="button" id="show-register" class="btn btn-link p-0 align-baseline">Register</button></p>
      </form>

      <!-- CREATE -->
      <form id="register-form" class="d-none" novalidate>
        <h2 class="h4 mb-3">Create an account</h2>
        <div class="mb-3">
          <label for="reg-name" class="form-label">Your name</label>
          <input id="reg-name" type="text" class="form-control" maxlength="60" autocomplete="name" required>
        </div>
        <div class="mb-3">
          <label for="reg-email" class="form-label">Email</label>
          <input id="reg-email" type="email" class="form-control" maxlength="120" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label for="reg-password" class="form-label">Password (at least 8 characters)</label>
          <input id="reg-password" type="password" class="form-control" minlength="8" autocomplete="new-password" required>
        </div>
        <div class="mb-3">
          <label for="reg-team" class="form-label">Favourite team (optional)</label>
          <select id="reg-team" class="form-select team-select"></select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Create account</button>
        <p class="mt-3 mb-0 text-center">Already registered?
          <button type="button" id="show-login" class="btn btn-link p-0 align-baseline">Log in</button></p>
      </form>

      <!-- READ / UPDATE / DELETE -->
      <section id="account" class="d-none">
        <h2 class="h4 mb-3">My account</h2>
        <dl class="row mb-4">
          <dt class="col-5">Name</dt><dd class="col-7" id="acc-name"></dd>
          <dt class="col-5">Email</dt><dd class="col-7" id="acc-email"></dd>
          <dt class="col-5">Favourite team</dt><dd class="col-7" id="acc-team"></dd>
          <dt class="col-5">Member since</dt><dd class="col-7" id="acc-since"></dd>
        </dl>

        <form id="edit-form" novalidate>
          <h3 class="h6">Edit details</h3>
          <div class="mb-3">
            <label for="edit-name" class="form-label">Name</label>
            <input id="edit-name" type="text" class="form-control" maxlength="60" required>
          </div>
          <div class="mb-3">
            <label for="edit-team" class="form-label">Favourite team</label>
            <select id="edit-team" class="form-select team-select"></select>
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-2">Save changes</button>
        </form>

        <button type="button" id="logout" class="btn btn-outline-secondary w-100 mb-2">Log out</button>
        <button type="button" id="delete-account" class="btn btn-outline-danger w-100">Delete my account</button>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="common.js"></script>
  <script src="login.js"></script>
</body>
</html>
