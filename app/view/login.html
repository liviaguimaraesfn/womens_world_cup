<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Log-in page of the Women's World Cup Database Museum.">
  <title>Log-in - Women's World Cup Database Museum</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">  <link href="styles.css" rel="stylesheet">
</head>
<body data-page="login">
  <div id="site-nav"></div>

  <header class="hero text-center text-white">
    <h1 class="display-5 fw-bold">Log-in</h1>
    <p class="lead mb-0">Save your favourite teams, players and stadiums, and keep your trivia scores.</p>
  </header>

  <main class="page-wrap content-area py-4 py-md-5">
    <div class="alert alert-info" role="status">Accounts are not available yet. This form will work once authentication is added.</div>
    <div class="login-box">
      <h2 class="h4 mb-3">Welcome back</h2>
      <fieldset disabled>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control" autocomplete="email">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-control" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </fieldset>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>  <script src="common.js"></script>
</body>
</html>
